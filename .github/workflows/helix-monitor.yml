name: Helix API test

on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Query Liseberg virtual queues
        run: |
          echo "Fetching Liseberg queues..."

          curl -sS \
            -H "Accept: application/json" \
            https://virtualqueue.liseberg.se/Queue \
            | tee queues.json

          echo ""
          echo "=== Searching for HELIX ==="
          grep -i -C 10 "helix" queues.json || true

          echo ""
          echo "=== Full response ==="
          cat queues.json
